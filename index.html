<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Edgar & More</title>
    
    <!-- Cargar React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Cargar Babel para entender JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cargar Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        royal: '#001B3A',
                        darkRoyal: '#001229',
                    },
                    fontFamily: {
                        serif: ['Times New Roman', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Estilos para animaciones -->
    <style>
        @keyframes fade-in-down {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .animate-fade-in-down { animation: fade-in-down 1s ease-out; }
        .animate-fade-in { animation: fade-in 1s ease-out; }
        
        /* Ocultar barra de scroll en móviles para limpieza visual */
        body::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-darkRoyal">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Iconos SVG (Reemplazo de Lucide para HTML estático) ---
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Heart = (props) => <IconWrapper {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></IconWrapper>;
        const Calendar = (props) => <IconWrapper {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>;
        const MapPin = (props) => <IconWrapper {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>;
        const Clock = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconWrapper>;
        const Gift = (props) => <IconWrapper {...props}><rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" /></IconWrapper>;
        const Music = (props) => <IconWrapper {...props}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></IconWrapper>;
        const Phone = (props) => <IconWrapper {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconWrapper>;
        const Copy = (props) => <IconWrapper {...props}><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></IconWrapper>;
        const Volume2 = (props) => <IconWrapper {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></IconWrapper>;
        const VolumeX = (props) => <IconWrapper {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" x2="17" y1="9" y2="15" /><line x1="17" x2="23" y1="9" y2="15" /></IconWrapper>;

        const App = () => {
            const [rsvpForm, setRsvpForm] = useState({
                nombre: '',
                asistencia: 'si',
                mensaje: ''
            });

            const [copiado, setCopiado] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const audioRef = useRef(null);

            // Fecha: 30 de Mayo de 2026, 3:00 PM
            const fechaBoda = new Date(2026, 4, 30, 15, 0, 0);

            const [tiempoRestante, setTiempoRestante] = useState({
                dias: 0, hours: 0, min: 0, seg: 0
            });

            const mapaCeremonia = "https://maps.app.goo.gl/xxWwCmuwPNMBiUbw5";
            const mapaRecepcion = "https://maps.app.goo.gl/qGKgGXWWoZtpwiSz6";
            const fotoPortada = "https://i.imgur.com/2eiwotS.jpeg";
            const audioUrl = "https://media.vocaroo.com/mp3/16seybRmS5qq"; 

            useEffect(() => {
                const timer = setInterval(() => {
                const ahora = new Date();
                const diferencia = fechaBoda - ahora;
                if (diferencia > 0) {
                    setTiempoRestante({
                    dias: Math.floor(diferencia / (1000 * 60 * 60 * 24)),
                    hours: Math.floor((diferencia / (1000 * 60 * 60)) % 24),
                    min: Math.floor((diferencia / 1000 / 60) % 60),
                    seg: Math.floor((diferencia / 1000) % 60)
                    });
                }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const toggleMusic = () => {
                if (audioRef.current) {
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play().catch(e => console.log("Error:", e));
                }
                setIsPlaying(!isPlaying);
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setRsvpForm(prev => ({ ...prev, [name]: value }));
            };

            const enviarWhatsApp = (e) => {
                e.preventDefault();
                if (!rsvpForm.nombre) return;
                const telefono = "524432726136";
                const texto = `Hola Edgar y More, soy *${rsvpForm.nombre}*. \nConfirmación: *${rsvpForm.asistencia === 'si' ? 'SÍ asistiré' : 'NO podré asistir'}* a su boda. \n${rsvpForm.mensaje ? `Mensaje: ${rsvpForm.mensaje}` : ''}`;
                window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(texto)}`, '_blank');
            };

            const copiarCuenta = () => {
                navigator.clipboard.writeText("1234567890123456");
                setCopiado(true);
                setTimeout(() => setCopiado(false), 2000);
            };

            // Clases para efecto Liquid Glass
            const glassCardClass = "bg-royal/40 backdrop-blur-md border border-gold/30 rounded-2xl shadow-xl p-8 transition-transform duration-300 hover:scale-[1.01]";
            const goldTextClass = "text-gold";

            return (
                <div className="min-h-screen bg-gradient-to-b from-darkRoyal to-royal font-serif text-white pb-12 max-w-md mx-auto md:max-w-full shadow-2xl md:shadow-none overflow-x-hidden relative selection:bg-gold selection:text-royal">
                
                <audio ref={audioRef} src={audioUrl} loop />

                <button 
                    onClick={toggleMusic}
                    className="fixed bottom-6 right-6 z-50 bg-gold text-royal p-3 rounded-full shadow-[0_0_15px_rgba(212,175,55,0.4)] hover:bg-[#E5C565] transition-all animate-fade-in"
                >
                    {isPlaying ? <Volume2 size={24} className="animate-pulse" /> : <VolumeX size={24} />}
                </button>

                {/* --- HERO SCREEN --- */}
                <header className="h-screen relative flex flex-col justify-between items-center py-12 px-6 text-center overflow-hidden">
                    <div className="absolute inset-0 z-0">
                    <img 
                        src={fotoPortada} 
                        alt="Edgar y More" 
                        className="w-full h-full object-cover object-center opacity-80"
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-darkRoyal/60 via-darkRoyal/30 to-darkRoyal"></div>
                    </div>
                    
                    <div className="text-gold uppercase tracking-[0.4em] text-xs z-10 animate-fade-in-down drop-shadow-md mt-6 border-b border-gold pb-2 px-4">
                    Nuestra Boda
                    </div>

                    <div className="z-10 flex flex-col items-center justify-center flex-grow w-full drop-shadow-2xl">
                    <div className="relative">
                        <h1 className="text-6xl md:text-8xl font-medium text-white leading-none mb-2" style={{ textShadow: '0 4px 10px rgba(0,0,0,0.5)' }}>
                        Edgar
                        </h1>
                        <span className={`text-6xl ${goldTextClass} font-light block my-2`}>&</span>
                        <h1 className="text-6xl md:text-8xl font-medium text-white leading-none" style={{ textShadow: '0 4px 10px rgba(0,0,0,0.5)' }}>
                        More
                        </h1>
                    </div>

                    <div className="w-24 h-0.5 bg-gradient-to-r from-transparent via-gold to-transparent my-10 shadow-lg"></div>

                    <p className="text-2xl text-[#E5E5E5] font-light mb-2 tracking-wide">30 de Mayo, 2026</p>
                    <p className={`text-sm ${goldTextClass} uppercase tracking-[0.2em]`}>Morelia, Michoacán</p>
                    
                    {!isPlaying && (
                        <button 
                        onClick={toggleMusic}
                        className="mt-10 flex items-center gap-2 px-6 py-2 bg-gold/20 backdrop-blur-md border border-gold/50 rounded-full text-gold text-xs uppercase tracking-widest hover:bg-gold/30 transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]"
                        >
                        <Music size={14} /> Reproducir Música
                        </button>
                    )}
                    </div>

                    <div className="z-10 w-full mb-4">
                    <div className="grid grid-cols-4 gap-2 text-center border-t border-gold/30 pt-6">
                        {[
                        { label: 'Días', val: tiempoRestante.dias },
                        { label: 'Hrs', val: tiempoRestante.hours },
                        { label: 'Min', val: tiempoRestante.min },
                        { label: 'Seg', val: tiempoRestante.seg }
                        ].map((t, i) => (
                        <div key={i}>
                            <span className={`block text-2xl font-bold ${goldTextClass} drop-shadow-sm`}>{t.val}</span>
                            <span className="text-[10px] uppercase text-white/60 tracking-wider">{t.label}</span>
                        </div>
                        ))}
                    </div>
                    </div>
                </header>

                {/* --- QUOTE --- */}
                <section className="px-6 py-12 text-center relative z-20 -mt-10">
                    <div className={`${glassCardClass} border-gold/20`}>
                    <Heart className={`w-6 h-6 ${goldTextClass} mx-auto mb-6`} fill="#D4AF37" />
                    <p className="text-xl italic text-white/90 leading-relaxed font-light">
                        "El amor no consiste en mirarse el uno al otro, sino en mirar juntos en la misma dirección."
                    </p>
                    </div>
                </section>

                {/* --- LOCATIONS --- */}
                <section className="px-4 py-4 space-y-6">
                    
                    {/* Ceremonia */}
                    <div className={glassCardClass}>
                    <div className="flex items-start justify-between mb-6 border-b border-white/10 pb-4">
                        <h3 className="text-3xl font-medium text-white">Ceremonia</h3>
                        <Calendar className={goldTextClass} />
                    </div>
                    <div className="space-y-4 mb-8">
                        <div className="flex items-center gap-4 text-[#E0E0E0]">
                        <Clock size={20} className={goldTextClass} />
                        <span className="font-light text-lg">3:00 PM</span>
                        </div>
                        <div className="flex items-start gap-4 text-[#E0E0E0]">
                        <MapPin size={20} className={`${goldTextClass} mt-1 flex-shrink-0`} />
                        <span>
                            <strong className="block text-white text-xl mb-1">Catedral de Morelia</strong>
                            <span className="text-sm opacity-70 font-sans font-light">Av. Francisco I. Madero Pte.</span>
                        </span>
                        </div>
                    </div>
                    <a href={mapaCeremonia} target="_blank" rel="noopener noreferrer" className="block w-full text-center py-3 border border-gold text-gold rounded-xl hover:bg-gold hover:text-royal transition-colors uppercase text-xs font-bold tracking-[0.2em]">
                        Ver en Mapa
                    </a>
                    </div>

                    {/* Recepcion */}
                    <div className={glassCardClass}>
                    <div className="flex items-start justify-between mb-6 border-b border-white/10 pb-4">
                        <h3 className="text-3xl font-medium text-white">Recepción</h3>
                        <Music className={goldTextClass} />
                    </div>
                    <div className="space-y-4 mb-8">
                        <div className="flex items-center gap-4 text-[#E0E0E0]">
                        <Clock size={20} className={goldTextClass} />
                        <span className="font-light text-lg">Después de ceremonia</span>
                        </div>
                        <div className="flex items-start gap-4 text-[#E0E0E0]">
                        <MapPin size={20} className={`${goldTextClass} mt-1 flex-shrink-0`} />
                        <span>
                            <strong className="block text-white text-xl mb-1">Salón Santa Sofía</strong>
                            <span className="text-sm opacity-70 font-sans font-light">Morelia, Michoacán</span>
                        </span>
                        </div>
                    </div>
                    <a href={mapaRecepcion} target="_blank" rel="noopener noreferrer" className="block w-full text-center py-3 bg-gold text-royal rounded-xl hover:bg-white transition-colors uppercase text-xs font-bold tracking-[0.2em]">
                        Cómo llegar
                    </a>
                    </div>
                </section>

                {/* --- TIMELINE --- */}
                <section className="py-12 px-8">
                    <h2 className="text-3xl text-center mb-12 text-gold">Itinerario</h2>
                    <div className="space-y-12 relative pl-4 border-l border-gold/30 ml-4">
                    {[
                        { t: '15:00', e: 'Ceremonia Religiosa', i: <Heart size={14} /> },
                        { t: '20:00', e: 'Baile de Novios', i: <Music size={14} /> },
                        { t: '21:00', e: 'Apertura de Regalos', i: <Gift size={14} /> }
                    ].map((item, idx) => (
                        <div key={idx} className="relative pl-8">
                        <div className="absolute -left-[20px] top-1 w-10 h-10 bg-royal border border-gold rounded-full flex items-center justify-center shadow-[0_0_10px_rgba(212,175,55,0.3)]">
                            <div className="w-2 h-2 bg-gold rounded-full"></div>
                        </div>
                        
                        <span className={`${goldTextClass} font-bold text-xl block mb-1`}>{item.t}</span>
                        <span className="text-white font-light text-lg">{item.e}</span>
                        </div>
                    ))}
                    </div>
                </section>

                {/* --- REGALOS --- */}
                <section className="px-4 py-8">
                    <div className={glassCardClass}>
                    <div className="text-center">
                        <Gift className={`w-8 h-8 mx-auto ${goldTextClass} mb-6`} />
                        <h2 className="text-2xl text-white mb-4">Mesa de Regalos</h2>
                        <p className="text-sm text-[#E0E0E0] mb-8 font-light leading-relaxed">
                        Su presencia es nuestro mejor regalo. Agradecemos su apoyo a nuestra luna de miel.
                        </p>
                    </div>
                    
                    <div 
                        className="bg-darkRoyal/60 border border-gold/20 p-6 rounded-xl text-left relative group cursor-pointer hover:border-gold/50 transition-colors" 
                        onClick={copiarCuenta}
                    >
                        <p className={`text-[10px] uppercase ${goldTextClass} mb-2 tracking-widest`}>BBVA - Edgar [Apellido]</p>
                        <div className="flex items-center justify-between">
                        <p className="font-sans text-xl text-white tracking-widest truncate">1234 5678 9012 3456</p>
                        {copiado ? <CheckCircle size={20} className="text-green-400"/> : <Copy size={20} className="text-white/50"/>}
                        </div>
                        <p className="text-[10px] text-white/40 mt-3 text-center font-sans uppercase tracking-wider">{copiado ? "¡Copiado al portapapeles!" : "Toca para copiar"}</p>
                    </div>
                    </div>
                </section>

                {/* --- RSVP --- */}
                <section className="px-4 pb-8">
                    <div className="bg-gold text-royal rounded-2xl p-8 shadow-[0_10px_40px_rgba(212,175,55,0.2)]">
                    <h2 className="text-3xl mb-2 text-center">Asistencia</h2>
                    <p className="text-royal/70 text-sm mb-8 text-center font-sans uppercase tracking-widest">Confirma antes del 30 de Abril</p>
                    
                    <form onSubmit={enviarWhatsApp} className="space-y-4">
                        <input 
                        required
                        type="text" 
                        name="nombre"
                        value={rsvpForm.nombre}
                        onChange={handleInputChange}
                        className="w-full bg-royal/10 border border-royal/20 rounded-xl p-4 text-royal placeholder-royal/50 focus:border-white outline-none font-sans"
                        placeholder="Nombre completo..."
                        />
                        
                        <div className="flex gap-2 font-sans">
                        {['si', 'no'].map(opt => (
                            <button
                            key={opt}
                            type="button"
                            onClick={() => setRsvpForm(p => ({...p, asistencia: opt}))}
                            className={`flex-1 py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-all border border-royal/20 ${
                                rsvpForm.asistencia === opt 
                                ? 'bg-royal text-gold' 
                                : 'bg-transparent text-royal'
                            }`}
                            >
                            {opt === 'si' ? 'Sí Asistiré' : 'No Asistiré'}
                            </button>
                        ))}
                        </div>

                        <button 
                        type="submit" 
                        className="w-full bg-royal text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 mt-4 hover:bg-[#002a5c] transition-colors font-sans uppercase text-sm tracking-widest"
                        >
                        <Phone size={18} />
                        Enviar WhatsApp
                        </button>
                    </form>
                    </div>
                </section>

                <footer className="text-center text-gold/40 text-[10px] py-8 font-sans uppercase tracking-[0.3em]">
                    Edgar & More • 2026
                </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
